name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    name: Check
    defaults:
      run:
        shell: nix develop .#ci --command bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false
      # The default shell builds the dev shell on first use. Give it a step of
      # its own so the download/build noise doesn't bury the `just check` logs.
      - name: Hydrate the Nix shell
        run: "true"
      - run: just check
